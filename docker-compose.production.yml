# Production docker-compose - only exposes API port
services:
  # Database migrations (runs once before other services)
  migrate:
    build:
      context: .
      args:
        SERVICE_TYPE: migrate
    env_file: .env.docker
    profiles:
      - migrate

  # FastAPI Application (only exposed service)
  api:
    build:
      context: .
      args:
        SERVICE_TYPE: api
    ports:
      - "3031:3031"
    env_file: .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
        required: false
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # Email Sender Worker (internal only)
  email-sender:
    build:
      context: .
      args:
        SERVICE_TYPE: email-sender
    env_file: .env.docker
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # IMAP Receiver Worker (internal only)
  imap-receiver:
    build:
      context: .
      args:
        SERVICE_TYPE: imap-receiver
    env_file: .env.docker
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # Webhook Delivery Worker (internal only)
  webhook-delivery:
    build:
      context: .
      args:
        SERVICE_TYPE: webhook-delivery
    env_file: .env.docker
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
